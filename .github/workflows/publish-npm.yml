# Publishes to npm when a version tag is pushed:
#   npm version patch
#   git push origin master --follow-tags
#
# Requires a Trusted Publisher (OIDC) for this repository on npm and an
# "npm-publish" GitHub environment.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@perdieminc/hapi-rate-limitor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. This job can publish, so stay on one major.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm publish

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
