# Publishes to npm when a version tag is pushed. The tag sets the version:
#   git switch master && git pull
#   git tag 5.0.1
#   git push origin 5.0.1
#
# The publish job waits for approval from a reviewer on the "npm-publish" GitHub
# environment, or an admin. Requires a Trusted Publisher (OIDC) for this repository on npm.

name: Publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.verify.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, to check that the tag is on master.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag can be released
        id: verify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          latest="$(npm view "$(node -p "require('./package.json').name")" version)"
          version="$(.github/scripts/verify-release.sh "$TAG" "$GITHUB_SHA" "$latest")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm audit
      - run: npm test

      - name: Set the version from the tag
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Packed here, because the publish job must not run any dependency's code.
      - run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@perdieminc/hapi-rate-limitor

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later. Pinned, because this job can publish.
      - run: npm install -g npm@11.21.1 --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # The tarball the test job built. Nothing is installed or built with publish rights.
      - run: npm publish ./*.tgz --ignore-scripts

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
